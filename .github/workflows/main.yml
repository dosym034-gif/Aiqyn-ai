name: Build AYQYN JARVIS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Check project files
        shell: bash
        run: |
          echo "Checking Android project..."

          test -f settings.gradle.kts || {
            echo "Missing settings.gradle.kts"
            exit 1
          }

          test -f build.gradle.kts || {
            echo "Missing build.gradle.kts"
            exit 1
          }

          test -f app/build.gradle.kts || {
            echo "Missing app/build.gradle.kts"
            exit 1
          }

      - name: Build Android APK
        shell: bash
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AYQYN-JARVIS-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
